<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{t_subject}}</title>
</head>
<!--
  Template ID : portal_reward_order_update

  Translated copy: {{lang}} + {{t_*}} variables, filled per language by
  portal/server/src/emailCopy.ts. Subject field in EmailJS: {{t_subject}}
  {{t_status_label}} is the order status in the partner's language (computed
  server-side; a plugin status the copy does not know arrives as Woo's name).
  Variables   : {{user_name}}, {{order_number}}, {{status}}, {{status_label}},
                {{message}} (optional note typed by an admin — may be empty),
                {{portal_url}}, {{to_email}}
  Recipient   : the certified partner whose reward order this is

  Never change a variable to triple braces: {{message}} is admin-typed text and
  {{user_name}} is partner-typed, and double braces keep both HTML-escaped.
-->
<body style="margin:0;padding:0;background-color:#f7efe3;font-family:Inter,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7efe3;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">

          <!-- HEADER -->
          <tr>
            <td style="background-color:#fefaf4;border-radius:8px 8px 0 0;border-bottom:1px solid #ddc9ae;padding:24px 40px;text-align:center;">
              <img src="https://sliquid-ai-creator.s3.us-east-2.amazonaws.com/reference-images/58439771-8fd8-454f-81eb-e2e5123dede5.png" alt="Sliquid" style="max-width:180px;height:auto;display:block;margin:0 auto;" />
              <p style="margin:10px 0 0;font-size:22px;font-weight:700;color:#0A84C0;letter-spacing:2px;">SLIQUID</p>
              <p style="margin:4px 0 0;font-size:11px;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;color:#a08060;">{{t_tagline}}</p>
            </td>
          </tr>

          <!-- CARD BODY -->
          <tr>
            <td style="background-color:#fefaf4;border-left:1px solid #ddc9ae;border-right:1px solid #ddc9ae;padding:40px 40px 32px;">

              <!-- Badge -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:20px;">
                <tr>
                  <td style="background-color:#e0f2fe;border:1px solid #7dd3fc;border-radius:4px;padding:4px 12px;">
                    <p style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#075985;">{{t_badge}}</p>
                  </td>
                </tr>
              </table>

              <h1 style="margin:0 0 8px;font-size:22px;font-weight:600;color:#2c1a0a;">{{t_heading}}</h1>
              <p style="margin:0 0 28px;font-size:15px;color:#6b4c30;line-height:1.6;">
                {{t_intro}}
              </p>

              <!-- Order info box -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;background-color:#f0e5d4;border:1px solid #ddc9ae;border-radius:8px;">
                <tr>
                  <td style="padding:24px 28px;">
                    <table width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="padding-bottom:16px;">
                          <p style="margin:0 0 4px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#a08060;">{{t_label_order}}</p>
                          <p style="margin:0;font-size:14px;font-weight:600;color:#2c1a0a;">#{{order_number}}</p>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <p style="margin:0 0 4px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#a08060;">{{t_label_status}}</p>
                          <p style="margin:0;font-size:14px;font-weight:600;color:#2c1a0a;">{{t_status_label}}</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <!-- Optional admin message (renders nothing when empty) -->
              <p style="margin:0 0 28px;font-size:15px;color:#2c1a0a;line-height:1.6;white-space:pre-line;">{{message}}</p>

              <p style="margin:0;font-size:13px;color:#a08060;line-height:1.6;">
                {{t_help}} <a href="mailto:support@sliquid.com" style="color:#0A84C0;text-decoration:none;">support@sliquid.com</a>
              </p>

            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background-color:#f0e5d4;border:1px solid #ddc9ae;border-top:none;border-radius:0 0 8px 8px;padding:20px 40px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#a08060;">
                {{t_footer_sent}}<br />
                {{t_footer_questions}} <a href="mailto:support@sliquid.com" style="color:#0A84C0;text-decoration:none;">support@sliquid.com</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
